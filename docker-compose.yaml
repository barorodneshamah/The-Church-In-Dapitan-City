services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: church_dapitan_root
      MYSQL_DATABASE: church_in_dapitan_db
      MYSQL_USER: church_dapitan
      MYSQL_PASSWORD: dapitan_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - church_in_dapitan_network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: church_dapitan
      PMA_PASSWORD: dapitan_password  
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - church_in_dapitan_network
volumes:
  mysql_data:
networks:
  church_in_dapitan_network:
    driver: bridge